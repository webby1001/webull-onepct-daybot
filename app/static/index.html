<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnePct Gap Daybot (paper)</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #e8eef7; background: #0b1220; }
    body { margin: 0; padding: 1.5rem; max-width: 960px; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    .muted { color: #9fb0c7; font-size: .9rem; }
    .warn { background: #3a1d0f; border: 1px solid #c47a3a; color: #ffd7b0; padding: .75rem 1rem; border-radius: 8px; margin: 1rem 0; }
    .card { background: #121a2b; border: 1px solid #243049; border-radius: 10px; padding: 1rem; margin: .75rem 0; }
    button { background: #3b82f6; color: white; border: 0; border-radius: 8px; padding: .55rem 1rem; cursor: pointer; margin-right: .5rem; }
    button.secondary { background: #334155; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: .85rem; }
    code { color: #93c5fd; }
  </style>
</head>
<body>
  <h1>webull-onepct-daybot</h1>
  <p class="muted">Gap continuation · paper bankroll · port 8082 · sibling of momentum-daybot</p>
  <div class="warn">
    <strong>Honesty:</strong> In-sample / paper / <em>not a guarantee</em>.
    Targeting ~1% mean daily return is extreme; historical fills ignore slippage &amp; capacity.
  </div>
  <div class="card">
    <button onclick="forceScan()">Force scan</button>
    <button class="secondary" onclick="flatten()">Flatten all</button>
    <button class="secondary" onclick="refresh()">Refresh</button>
  </div>
  <div class="card"><h3>Status</h3><pre id="status">loading…</pre></div>
  <div class="card"><h3>Positions</h3><pre id="positions">[]</pre></div>
  <script>
    async function refresh() {
      const s = await fetch('/status').then(r => r.json());
      document.getElementById('status').textContent = JSON.stringify(s, null, 2);
      const p = await fetch('/positions').then(r => r.json());
      document.getElementById('positions').textContent = JSON.stringify(p, null, 2);
    }
    async function forceScan() {
      const r = await fetch('/force-scan', { method: 'POST' }).then(r => r.json());
      alert(r.message || JSON.stringify(r));
      refresh();
    }
    async function flatten() {
      await fetch('/flatten-all', { method: 'POST' });
      refresh();
    }
    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
